name: Build

on:
  push:
    #branches: [ "main" ]
    paths:
      - "**.hpp"
      - "**.h"
      - "**.cpp"
      - "**.c"
      - "**.cc"
      - "**.in"
      - "**/CMakeLists.txt"
      - "**/vcpkg.json"
      - ".github/workflows/build.yml"
  pull_request:
    #branches: [ "main" ]
    paths:
      - "**.hpp"
      - "**.h"
      - "**.cpp"
      - "**.c"
      - "**.cc"
      - "**.in"
      - "**/CMakeLists.txt"
      - "**/vcpkg.json"
      - ".github/workflows/build.yml"
  workflow_dispatch:
    inputs:
      name:
        required: false

jobs:
  build-linux:
    name: Linux x86 build
    runs-on: ubuntu-latest
    continue-on-error: false
    strategy:
      max-parallel: 2
      fail-fast: false
      matrix:
        build-type: [Debug, Release]
    env:
      BUILD_TYPE: ${{ matrix.build-type }}
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg

    steps:
    - uses: actions/checkout@v4
      with:
        clean: true
        fetch-depth: 0

    - name: Checkout submodules
      run: git submodule update --init --recursive

    - name: Preparing some system related...
      run: |
        sudo dpkg --add-architecture i386;
        sudo apt-get update;
        sudo apt-get upgrade -y;
        sudo add-apt-repository ppa:ubuntu-toolchain-r/test -y;
        sudo apt-get install -y --fix-missing \
          tar wget binutils cmake make \
          gcc g++ libc6-dev-i386 libc6-dev gcc-multilib g++-multilib build-essential \
          libcurl4:i386 libcurl4-openssl-dev:i386 ninja-build;
        wget "https://github.com/conan-io/conan/releases/download/1.66.0/conan-ubuntu-64.deb"
        sudo dpkg -i conan-ubuntu-64.deb

    - name: Preparing some...
      working-directory: ${{github.workspace}}
      run: |
        mkdir -p build
        git clone --depth 1 https://github.com/microsoft/vcpkg.git vcpkg
        ./vcpkg/bootstrap-vcpkg.sh

    - name: Configure CMake Server (${{ github.ref }})
      run: cmake -S Server -B ${{github.workspace}}/build/Server -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -G "Ninja" -DCMAKE_SYSTEM_PROCESSOR=i686 -DCMAKE_C_FLAGS="-m32" -DCMAKE_CXX_FLAGS="-m32" -DCMAKE_EXE_LINKER_FLAGS="-m32" -DCMAKE_SHARED_LINKER_FLAGS="-m32" -DCMAKE_TOOLCHAIN_FILE=${{github.workspace}}/vcpkg/scripts/buildsystems/vcpkg.cmake -DVCPKG_TARGET_TRIPLET="x86-linux"

    - name: Build Server (${{ github.ref }})
      run: cmake --build ${{github.workspace}}/build/Server --config ${{env.BUILD_TYPE}} --parallel 4

    - name: Upload Linux Server Artifact
      uses: actions/upload-artifact@v7
      with:
        name: ExtendedVehicles-Linux-${{ matrix.build-type }}
        path: |
          Server/bin/*.so
          build/Server/*.so
          build/Server/bin/*.so
        if-no-files-found: error

  build-windows:
    name: Windows x32 build
    runs-on: windows-latest
    continue-on-error: false
    strategy:
      max-parallel: 2
      fail-fast: false
      matrix:
        build-type: [Debug, Release]
    env:
      BUILD_TYPE: ${{ matrix.build-type }}
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg

    steps:
    - uses: actions/checkout@v4
      with:
        clean: true
        fetch-depth: 0

    - name: Checkout submodules
      run: git submodule update --init --recursive

    - name: Install CMake
      uses: lukka/get-cmake@latest

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v3.0.0

    - name: Preparing some...
      working-directory: ${{github.workspace}}
      run: |
        mkdir build
        git clone --depth 1 https://github.com/microsoft/vcpkg.git vcpkg
        cd ./vcpkg
        ./bootstrap-vcpkg.bat

    - name: Configure CMake Client (${{ github.ref }})
      run: cmake -S Client -B ${{github.workspace}}/build/Client -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -A Win32 -DCMAKE_POLICY_VERSION_MINIMUM="3.5" --preset=vcpkg -DCMAKE_TOOLCHAIN_FILE="${{github.workspace}}/vcpkg/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET="x86-windows" -DVCPKG_MANIFEST_MODE=ON -DCMAKE_PREFIX_PATH="${{github.workspace}}/vcpkg/installed/x86-windows"

    - name: Build Client (${{ github.ref }})
      run: cmake --build ${{github.workspace}}/build/Client --config ${{env.BUILD_TYPE}} --preset=vcpkg

    - name: Configure CMake Server (${{ github.ref }})
      run: cmake -S Server -B ${{github.workspace}}/build/Server -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -A Win32 -DCMAKE_POLICY_VERSION_MINIMUM="3.5" --preset=vcpkg -DCMAKE_TOOLCHAIN_FILE="${{github.workspace}}/vcpkg/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET="x86-windows" -DVCPKG_MANIFEST_MODE=ON -DCMAKE_PREFIX_PATH="${{github.workspace}}/vcpkg/installed/x86-windows"

    - name: Build Server (${{ github.ref }})
      run: cmake --build ${{github.workspace}}/build/Server --config ${{env.BUILD_TYPE}} --preset=vcpkg

    - name: Prepare Artifacts
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path "dist"
        # Find client ASI or DLL
        $clientAsi = Get-ChildItem -Path "Client", "build/Client" -Filter "*brownturbo-extendedveh*.asi" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
        if ($clientAsi) {
          Copy-Item $clientAsi.FullName "dist/brownturbo-extendedveh.asi" -Force
        } else {
          $clientDll = Get-ChildItem -Path "Client", "build/Client" -Filter "*brownturbo-extendedveh*.dll" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($clientDll) {
            Copy-Item $clientDll.FullName "dist/brownturbo-extendedveh.asi" -Force
          }
        }
        # Find server DLL
        $serverDll = Get-ChildItem -Path "Server", "build/Server" -Filter "*extended-vehicles*.dll" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
        if ($serverDll) {
          Copy-Item $serverDll.FullName "dist/extended-vehicles.dll" -Force
        }

    - name: Upload Windows Client Artifact (ASI)
      uses: actions/upload-artifact@v7
      with:
        name: BrownTurbo-ExtendedVeh-Win32-ASI-${{ matrix.build-type }}
        path: dist/brownturbo-extendedveh.asi
        if-no-files-found: error

    - name: Upload Windows Server Artifact (DLL)
      uses: actions/upload-artifact@v7
      with:
        name: ExtendedVehicles-Win32-Server-${{ matrix.build-type }}
        path: dist/extended-vehicles.dll
        if-no-files-found: error
