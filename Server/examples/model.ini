# [audio]
# Custom 3D audio files (.wav or .ogg) streamed to clients.
# If omitted or left empty, the vehicle uses native audio from audioBase (400-611).
# File names are strictly formed: engine, acceleration, deacceleration, brake, crash (.wav / .ogg)
# engine = engine.ogg            # Base engine running/idle sound (looped)
# acceleration = acceleration.ogg # Acceleration "vrooom" sound with speed & throttle pitch modulation (looped)
# deacceleration = deacceleration.ogg # Deceleration overrun sound on throttle release (looped)
# brake = brake.ogg              # Brake squeal / braking sound (triggered on brake input)
# crash = crash.ogg              # Impact sound on vehicle collision damage
# volume = 1.0                   # Volume multiplier (0.0 to 2.0, default 1.0)
# minDistance = 5.0              # 3D sound min distance in meters (default 5.0)
# maxDistance = 90.0             # 3D sound max audible distance in meters (default 90.0)
# pitchMultiplier = 1.0          # Base pitch multiplier (default 1.0)
# accelPitchFactor = 0.5         # How strongly acceleration revs pitch up (default 0.5)
# muteNative = 1                 # 1 = mute native GTA vehicle audio entity, 0 = keep native audio playing

